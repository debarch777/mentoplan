name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Unit and finite-element verification tests
        # integration tests need a processed CT/CBCT case and skip automatically here
        run: cd backend && python -m pytest -q
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type-check and build
        run: cd frontend && npm ci && npx tsc --noEmit -p . && npx vite build
